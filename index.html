<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level Rankings</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1c1b1a;--muted:#6b6862;--accent:#c0392b;--border:#e3e0d9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1d1b;--text:#efede8;--muted:#9a968d;--accent:#ff6b5a;--border:#33312d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1d1b;--text:#efede8;--muted:#9a968d;--accent:#ff6b5a;--border:#33312d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.banner{position:fixed;top:0;left:0;right:0;height:260px;background:center/cover no-repeat;z-index:0;pointer-events:none;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:200px 16px 48px}
h1{margin:0 0 4px;font-size:1.8rem}
.sub{color:var(--muted);margin:0 0 16px}
.bar{display:flex;gap:8px;margin-bottom:16px}
input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:1rem}
button{padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:.95rem}
ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{background:var(--card);border:1px solid var(--border);border-radius:10px}
summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--muted);transition:transform .15s}
details[open] summary::after{transform:rotate(180deg)}
.thumb{width:96px;height:54px;object-fit:cover;border-radius:6px;flex:none;background:var(--border)}
.id{font-variant-numeric:tabular-nums;color:var(--muted)}
.rid{display:block;font-weight:400;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.discord{margin-left:auto;display:inline-flex;align-items:center;padding:10px 14px;border-radius:8px;background:#5865f2;color:#fff;font-size:.95rem;font-weight:600;text-decoration:none}
.discord:hover{background:#4752c4}
[hidden]{display:none!important}
.pbtn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:14px;cursor:pointer;border-radius:10px}
.pbtn:hover .name{color:var(--accent)}
.pbtn:focus-visible{outline:2px solid var(--accent)}
.pbtn::after{content:"›";color:var(--muted);font-size:1.4rem;line-height:1}
#pList li{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;align-items:center}
#pList a{color:var(--text);text-decoration:none;font-weight:600}
#pList a:hover{color:var(--accent);text-decoration:underline}
#back{margin-bottom:12px}
#adm3{margin-bottom:16px;padding:16px;border:1px dashed var(--accent);border-radius:10px;background:var(--card)}
#adm3 h3{margin:0 0 12px;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fgrid input{min-width:0}
.ver{display:flex;flex-wrap:wrap;gap:12px 32px}
.vl,.vr{display:grid;gap:6px;align-content:start}
.vr{margin-left:auto;min-width:150px}
.fgrid #nlAdd{grid-column:1/-1}
.rm{justify-self:start;margin-top:6px;color:var(--accent)}
#pName{margin:0 0 4px;font-size:1.5rem}
#adm,#adm2{margin-top:24px;padding:16px;border:1px dashed var(--accent);border-radius:10px;background:var(--card)}
#adm h3,#adm2 h3{margin:0 0 12px;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
select{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem}
#mList li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px}
.chip{display:inline-flex;gap:6px;align-items:center;margin:4px 6px 0 0;padding:4px 6px 4px 12px;border:1px solid var(--border);border-radius:99px;font-size:.9rem}
.x{padding:0 6px;border:0;background:none;cursor:pointer;color:var(--accent);font-size:1.1rem}
.rec{display:flex;justify-content:space-between;gap:12px}
.rec a{color:var(--text);text-decoration:none}
.rec a:hover{color:var(--accent);text-decoration:underline}
.rec b{color:var(--accent);font-variant-numeric:tabular-nums}
.none{color:var(--muted)}
#lb li:nth-child(-n+3) .rank{color:var(--accent);font-weight:700}
.ver{padding:0 14px 14px 62px;display:grid;gap:6px;font-size:.95rem}
.ver h3{margin:0;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ver a{color:var(--accent)}
.rank{width:2.2rem;color:var(--muted);font-variant-numeric:tabular-nums}
.name{flex:1;font-weight:600}
.name a{color:var(--text);text-decoration:none}
.name a:hover{color:var(--accent);text-decoration:underline}
.nolink{color:var(--muted);font-weight:400;font-size:.8rem;margin-left:6px}
.pts{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}

.admin-access{margin:16px 0 20px;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:0 16px 12px}
.admin-access>summary{padding:12px 0;font-weight:650}.admin-access>summary::after{margin-left:auto}
.admin-access form{display:grid;gap:12px;margin-bottom:12px}.admin-access [hidden]{display:none}
.admin-access label{display:grid;gap:6px;font-size:.9rem}.admin-access input{min-width:0}
#saveStatus{color:var(--accent)}button:disabled{opacity:.55;cursor:wait}select{min-width:0;max-width:100%}input{min-width:0}
</style>
</head>

let desc=true;
const list=document.getElementById("list"),q=document.getElementById("q"),dir=document.getElementById("dir"),count=document.getElementById("count");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
const t=q.value.trim().toLowerCase();
const sorted=[...levels].sort((a,b)=>desc?b[1]-a[1]:a[1]-b[1]);
const rows=sorted.map((l,i)=>({l,i:i+1})).filter(r=>r.l[0].toLowerCase().includes(t));
count.textContent=rows.length+" of "+levels.length+" levels, ordered by points";
list.innerHTML=rows.map(({l,i})=>{
const name=l[2]?`<a href="${esc(l[2])}" target="_blank" rel="noopener noreferrer">${esc(l[0])}</a>`:`${esc(l[0])}<span class="nolink">no video</span>`;
const vids=(VERIFY[l[0]]||(l[2]?[["Verification video",l[2]]]:[])).map(v=>`<a href="${v[1]}" target="_blank" rel="noopener noreferrer">${esc(v[0])}</a>`).join("");
return `<li><details><summary><span class="rank">#${i}</span>${THUMBS[l[0]]?`<img class="thumb" alt="" loading="lazy" src="${THUMBS[l[0]]}">`:'<span class="thumb"></span>'}<span class="name">${name}<span class="rid">ID ${esc(IDS[l[0]]||"—")}</span></span><span class="pts">${l[1]}</span></summary><div class="ver"><div class="vl"><h3>Level ID</h3><span class="id">${esc(IDS[l[0]]||"Not added yet")}</span><h3>Verifier</h3><span class="id">${esc(VERIFIERS[l[0]]||"Not added yet")}</span>${l[2]?`<h3>Verification videos</h3>${vids}`:""}${canAdmin&&DB&&XL.some(o=>o.name===l[0])?`<button class="rm" data-del="${esc(l[0])}">Remove this level</button>`:""}</div><div class="vr"><h3>Victors</h3>${victors(l[0])}</div></div></details></li>`}).join("");
}
q.addEventListener("input",render);
const bn=document.getElementById("banner");
function fade(){bn.style.opacity=Math.max(0,1-window.scrollY/450)}
window.addEventListener("scroll",fade,{passive:true});fade();
const PLAYERS=[["Fotca",642.5],["TheOmol",534],["Fetixis",258],["FluffyGames1",176],["Wolfscout",110],["F0cUs10000",81],["Conor",57],["Ilovetoken",54],["Esk",51.5],["Nuri",44],["Tix",32.5],["Darwin",20],["potionmarker",15],["Soan9",9],["Мартин Димитров [EVIL]",1]];
function recs(n){const r=levels.filter(l=>VERIFIERS[l[0]]===n).sort((a,b)=>b[1]-a[1]);if(!r.length)return '<span class="none">No records added yet</span>';return '<h3>Verified levels</h3>'+r.map(l=>`<div class="rec"><span>${l[2]?`<a href="${esc(l[2])}" target="_blank" rel="noopener noreferrer">${esc(l[0])}</a>`:esc(l[0])}</span><b>${l[1]}</b></div>`).join('')}
function renderLeaderboard(){document.getElementById("lb").innerHTML=PLAYERS.map((p,i)=>({p,i})).sort((a,b)=>score(b.p)-score(a.p)).map(({p,i},rank)=>`<li><button class="pbtn" data-i="${i}"><span class="rank">#${rank+1}</span><span class="name">${esc(p[0])}</span><span class="pts">${score(p)} pts</span></button></li>`).join("");}
function score(p){return p[1]+recsFor(p[0]).filter(l=>!BASE.some(b=>b[0]===l[0]&&BASE_VERIFIERS[l[0]]===p[0])).reduce((sum,l)=>sum+l[1],0)}
function showPlayer(i,keep){curP=i;const p=PLAYERS[i];const r=recsFor(p[0]);
document.getElementById("ttl").textContent="Leaderboard Rankings";document.getElementById("pName").textContent="#"+(PLAYERS.slice().sort((a,b)=>score(b)-score(a)).indexOf(p)+1)+" "+p[0];
document.getElementById("pPts").textContent=score(p)+" points · "+(r.length?r.length+" completion"+(r.length>1?"s":"")+" listed":"no completions added yet");
document.getElementById("pList").innerHTML=r.length?r.map(l=>`<li><span>${l[2]?`<a href="${esc(l[2])}" target="_blank" rel="noopener noreferrer">${esc(l[0])}</a>`:esc(l[0])}</span><span class="pts">${l[1]}</span></li>`).join(""):'<li><span class="none">No completions added yet</span></li>';
document.getElementById("levelsView").hidden=true;document.getElementById("lbView").hidden=true;document.getElementById("pView").hidden=false;count.hidden=true;
document.getElementById("tabL").classList.remove("on");document.getElementById("tabP").classList.add("on");if(!keep)window.scrollTo({top:0,behavior:"smooth"});renderAdmin(p[0])}
document.getElementById("lb").addEventListener("click",e=>{const b=e.target.closest(".pbtn");if(b)showPlayer(+b.dataset.i)});
document.getElementById("back").onclick=()=>tab(true);
function victors(n){const v=PLAYERS.filter(p=>recsFor(p[0]).some(l=>l[0]===n));return v.length?v.map(p=>`<span class="id">${esc(p[0])}</span>`).join(""):'<span class="id">None yet</span>'}
let DB=null,EXTRA={},canAdmin=false,curP=-1,MODS=[],XL=[];
const BASE=levels.slice(),BASE_VERIFIERS={...VERIFIERS};
function applyExtra(){levels.length=0;levels.push(...BASE);Object.keys(VERIFIERS).forEach(k=>{if(!Object.hasOwn(BASE_VERIFIERS,k))delete VERIFIERS[k]});XL.forEach(o=>{levels.push([o.name,+o.points,o.url||null]);if(o.id)IDS[o.name]=o.id;if(o.verifier)VERIFIERS[o.name]=o.verifier});render();renderLeaderboard();if(curP>=0)showPlayer(curP,true)}
async function saveLevels(list){try{await DB.doc("levels/all").set({items:list});XL=list;applyExtra();renderAddLevel()}catch(e){status(e.message)}}
function renderAddLevel(){const b=document.getElementById("addLevel");if(!(canAdmin&&DB)){b.innerHTML="";return}
b.innerHTML='<div id="adm3"><h3>Admin: add a level</h3><div class="fgrid"><input id="nlName" aria-label="Level name" placeholder="Level name"><input id="nlPts" aria-label="Points" type="number" step="any" min="0" placeholder="Points"><input id="nlUrl" aria-label="Video link" placeholder="Video link (optional)"><input id="nlId" aria-label="Level ID" placeholder="Level ID (optional)"><input id="nlVer" aria-label="Verifier" placeholder="Verifier (optional)"><button id="nlAdd">Add level</button></div></div>';
const g=i=>document.getElementById(i);
g("nlAdd").onclick=()=>{const name=g("nlName").value.trim(),pts=parseFloat(g("nlPts").value);if(!name||!Number.isFinite(pts)||pts<0){alert("Enter a level name and points.");return}if(levels.some(l=>l[0].toLowerCase()===name.toLowerCase())){alert("That level already exists.");return}let url=g("nlUrl").value.replace(/["'<>\s]/g,"");if(url&&!/^https?:\/\//i.test(url))url="https://"+url;saveLevels([...XL,{name,points:pts,url,id:g("nlId").value.trim(),verifier:g("nlVer").value.trim()}])}}
list.addEventListener("click",e=>{const b=e.target.closest(".rm");if(b&&confirm("Remove this level?"))saveLevels(XL.filter(o=>o.name!==b.dataset.del))});
function renderMods(){const x=canAdmin&&DB;document.getElementById("mView").innerHTML=`<p class="sub">The people who help run the list</p><ol id="mList">${MODS.length?MODS.map(n=>`<li><span class="name">${esc(n)}</span>${x?`<button class="x" data-n="${esc(n)}" aria-label="Remove ${esc(n)}">×</button>`:""}</li>`).join(""):'<li><span class="none">No list mods added yet</span></li>'}</ol>${x?'<div id="adm2"><h3>Admin: add list mods</h3><div class="bar"><input id="modIn" placeholder="Mod name" aria-label="Mod name"><button id="modAdd">Add mod</button></div></div>':""}`}
async function saveMods(l){try{await DB.doc("mods/all").set({names:l});MODS=l;renderMods()}catch(e){status(e.message)}}
document.getElementById("mView").addEventListener("click",e=>{const b=e.target.closest(".x");if(b)saveMods(MODS.filter(n=>n!==b.dataset.n));if(e.target.id==="modAdd"){const i=document.getElementById("modIn"),v=i.value.trim();if(v&&!MODS.includes(v))saveMods([...MODS,v])}});
function showMods(){curP=-1;document.getElementById("ttl").textContent="List Mods";document.getElementById("levelsView").hidden=true;document.getElementById("lbView").hidden=true;document.getElementById("pView").hidden=true;document.getElementById("mView").hidden=false;count.hidden=true;document.getElementById("tabL").classList.remove("on");document.getElementById("tabP").classList.remove("on");document.getElementById("tabM").classList.add("on");renderMods()}
document.getElementById("tabM").onclick=showMods;
renderMods();
function recsFor(n){const s=new Set(levels.filter(l=>VERIFIERS[l[0]]===n).map(l=>l[0]));(EXTRA[n]||[]).forEach(x=>s.add(x));return levels.filter(l=>s.has(l[0])).sort((a,b)=>b[1]-a[1])}
async function save(name,list){const m={...EXTRA,[name]:list};try{await DB.doc("completions/all").set({map:m});EXTRA=m;render();renderLeaderboard();if(curP>=0)showPlayer(curP,true)}catch(e){status(e.message)}}
function renderAdmin(name){let box=document.getElementById("adm");if(!canAdmin||!DB){if(box)box.remove();return}
if(!box){box=document.createElement("div");box.id="adm";document.getElementById("pView").appendChild(box)}
const have=[...(EXTRA[name]||[])];
const opts=[...levels].sort((a,b)=>b[1]-a[1]).filter(l=>!recsFor(name).some(r=>r[0]===l[0])).map(l=>`<option>${esc(l[0])}</option>`).join("");
box.innerHTML=`<h3>Admin: add completions</h3><div class="bar"><select id="admSel" aria-label="Level to add">${opts}</select><button id="admAdd">Add</button></div><div>${have.map(n=>`<span class="chip">${esc(n)}<button class="x" data-n="${esc(n)}" aria-label="Remove ${esc(n)}">×</button></span>`).join("")}</div>`;
document.getElementById("admAdd").disabled=!opts;document.getElementById("admAdd").onclick=()=>{const v=document.getElementById("admSel").value;if(v)save(name,[...have,v])};
box.querySelectorAll(".x").forEach(b=>b.onclick=()=>save(name,have.filter(n=>n!==b.dataset.n)))}
const versions={};
let saving=false;
function status(message){document.getElementById('saveStatus').textContent=message}
async function loadData(){
 const response=await fetch('/api/data',{cache:'no-store'});
 if(!response.ok)throw new Error('Saved data could not be loaded. Please refresh to try again.');
 const data=await response.json();
 for(const [key,doc] of Object.entries(data))versions[key]=doc.version;
 XL=data.levels.value.items;EXTRA=data.completions.value.map;MODS=data.mods.value.names;
 applyExtra();renderMods();renderAddLevel();
}
const database={doc(path){return {async set(value){
 if(saving)throw new Error('A change is already being saved. Please wait.');
 saving=true;status('Saving…');
 try{
  await getUser();
  const key=path.split('/')[0];
  const response=await fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,value,version:versions[key]})});
  const result=await response.json();
  if(!response.ok){if(response.status===409)await loadData();throw new Error(result.error||'Could not save changes.');}
  versions[key]=result.version;status('Changes saved.');
 }finally{saving=false}
 }}}};
async function refreshAccess(){
 const user=await getUser();
 const response=await fetch('/api/session',{cache:'no-store'});
 if(!response.ok)throw new Error('Admin access could not be checked. Please try again.');
 canAdmin=(await response.json()).admin;
 document.getElementById('loginForm').hidden=!!user;
 document.getElementById('adminLogout').hidden=!user;
 document.getElementById('authStatus').textContent=canAdmin?'Signed in as an admin. Add levels below, or open a player from the leaderboard to add completions.':user?'This account does not have the admin role. Ask the site owner to grant access.':'Sign in with your invited admin account.';
 render();renderAddLevel();renderMods();if(curP>=0)renderAdmin(PLAYERS[curP][0]);
}
let inviteToken=null;
async function authAction(form,action){
 const buttons=form.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);
 try{await action()}catch(e){document.getElementById('authStatus').textContent=e.message||'Unable to sign in. Please try again.'}
 finally{buttons.forEach(b=>b.disabled=false)}
}
document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();authAction(e.currentTarget,async()=>{await login(document.getElementById('adminEmail').value.trim(),document.getElementById('adminPassword').value);document.getElementById('adminPassword').value='';await refreshAccess()})};
document.getElementById('adminLogout').onclick=()=>authAction(document.getElementById('adminAccess'),async()=>{await logout();canAdmin=false;await refreshAccess()});
document.getElementById('forgotPassword').onclick=()=>authAction(document.getElementById('loginForm'),async()=>{
 const email=document.getElementById('adminEmail');if(!email.reportValidity()||!email.value)return;
 await requestPasswordRecovery(email.value.trim());document.getElementById('authStatus').textContent='Check your email for a password reset link.';
});
document.getElementById('passwordForm').onsubmit=e=>{e.preventDefault();authAction(e.currentTarget,async()=>{
 const password=document.getElementById('newPassword').value;
 if(inviteToken){await acceptInvite(inviteToken,password);inviteToken=null}else await updateUser({password});
 document.getElementById('newPassword').value='';document.getElementById('passwordForm').hidden=true;await refreshAccess();
})};
(async()=>{
 try{await loadData();DB=database}catch(e){status(e.message)}
 try{
 const callback=await handleAuthCallback();
 if(callback?.type==='invite'||callback?.type==='recovery'){
  inviteToken=callback.type==='invite'?callback.token:null;
  document.getElementById('adminAccess').open=true;
  document.getElementById('passwordForm').hidden=false;
  document.getElementById('authStatus').textContent='Set a password to continue.';
 }else await refreshAccess();
 }catch(e){document.getElementById('authStatus').textContent='Unable to check admin access. '+e.message;document.getElementById('loginForm').hidden=false}
})();

function tab(lb){curP=-1;document.getElementById("ttl").textContent=lb?"Leaderboard Rankings":"Level Rankings";document.getElementById("pView").hidden=true;document.getElementById("mView").hidden=true;document.getElementById("tabM").classList.remove("on");document.getElementById("levelsView").hidden=lb;document.getElementById("lbView").hidden=!lb;document.getElementById("tabL").classList.toggle("on",!lb);document.getElementById("tabP").classList.toggle("on",lb);count.hidden=lb}
document.getElementById("tabL").onclick=()=>tab(false);
document.getElementById("tabP").onclick=()=>tab(true);
dir.addEventListener("click",()=>{desc=!desc;dir.textContent=desc?"Highest first":"Lowest first";render()});
render();renderLeaderboard();
</script>
</body>
</html>
